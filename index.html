<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NY Legislature Expenditures Explorer</title>
  <meta name="description" content="Search and explore every line of the New York State Assembly and Senate semi-annual Expenditure Reports: member offices, staff payroll, vendors, travel and allocated costs.">
  <meta property="og:title" content="NY Legislature Expenditures Explorer">
  <meta property="og:description" content="Every line of the New York State Assembly's and Senate's spending reports: searchable, mapped by district, and comparable member by member.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://rike4545.github.io/NYS-Assembly-Expenditures/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1f5fa8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%231f5fa8%27/%3E%3Cpath d=%27M4 12V7m4 5V4m4 8V9%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <a class="brand-title" href="#/">NY Legislature Expenditures</a>
        <div class="brand-controls">
          <div class="chamber-switch" id="chamberSwitch" role="group" aria-label="Chamber"></div>
          <label class="period-pick"><span>Report period</span>
            <select id="periodSelect" aria-label="Report period"></select>
          </label>
        </div>
      </div>
      <form class="global-search" id="globalSearch" role="search">
        <input type="search" id="globalSearchInput" placeholder="Search members, staff, vendors, descriptions…" aria-label="Search all records" autocomplete="off">
      </form>
    </div>
    <nav class="wrap tabs" aria-label="Sections">
      <a href="#/" data-tab="overview">Overview</a>
      <a href="#/units" data-tab="units">Members &amp; Offices</a>
      <a href="#/records" data-tab="records">All Records</a>
      <a href="#/map" data-tab="map">District Map</a>
      <a href="#/compare" data-tab="compare">Compare</a>
      <a href="#/payees" data-tab="payees">Payees</a>
      <a href="#/about" data-tab="about">About the Data</a>
    </nav>
  </header>

  <main class="wrap" id="app" tabindex="-1">
    <p class="loading">Loading expenditure data…</p>
  </main>

  <footer class="wrap site-footer">
    Sources: <a href="https://assembly.ny.gov/expenditure/" target="_blank" rel="noopener">NYS Assembly</a> and <a href="https://www.nysenate.gov/open-data" target="_blank" rel="noopener">NYS Senate</a> expenditure reports
    · Viewing <code id="sourceFile"></code>
    · Independent presentation of public records; not affiliated with the Legislature.
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
