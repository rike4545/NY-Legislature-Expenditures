name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Rebuild data from raw CSVs
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_districts.py
          python3 scripts/build_ballotpedia.py
          python3 scripts/build_members.py
          python3 scripts/build_payroll.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/chambers.json data/election_sources.json _site/data/
          for c in assembly senate; do mkdir -p _site/data/$c && cp -r data/$c/periods data/$c/districts.json data/$c/ballotpedia.json data/$c/members.json _site/data/$c/; [ -d data/$c/travel ] && cp -r data/$c/travel _site/data/$c/; if [ -f data/$c/payroll.json ]; then cp data/$c/payroll.json _site/data/$c/; fi; cp data/$c/campaign_finance.json data/$c/makeup.json data/$c/donations.json data/$c/demographics.json data/$c/enrollment.json data/$c/public_financing.json data/$c/outside_money.json data/$c/history.json data/$c/legislation.json data/$c/endorsement_links.json _site/data/$c/; [ -f data/$c/lobbying.json ] && cp data/$c/lobbying.json _site/data/$c/ || true; done
          cp data/vendor_donors.json data/limits_2026.json _site/data/ && mkdir -p _site/data/geo && cp data/geo/zip_districts.json _site/data/geo/ && mkdir -p _site/data/elections && cp data/elections/boe_2026_assembly.json data/elections/boe_2026_senate.json _site/data/elections/
          mkdir -p _site/data/budget && cp data/budget/legislature.json data/budget/history.json _site/data/budget/
          cp docs/social-preview.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
