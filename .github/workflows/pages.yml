name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data from raw CSVs
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_districts.py
          python3 scripts/build_ballotpedia.py
          python3 scripts/build_members.py
          python3 scripts/build_payroll.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/chambers.json data/election_sources.json _site/data/
          for c in assembly senate; do mkdir -p _site/data/$c && cp -r data/$c/periods data/$c/districts.json data/$c/ballotpedia.json data/$c/members.json _site/data/$c/; [ -d data/$c/travel ] && cp -r data/$c/travel _site/data/$c/; if [ -f data/$c/payroll.json ]; then cp data/$c/payroll.json _site/data/$c/; fi; cp data/$c/campaign_finance.json _site/data/$c/; done
          mkdir -p _site/data/budget && cp data/budget/legislature.json _site/data/budget/
          cp docs/social-preview.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
