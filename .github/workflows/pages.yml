name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rebuild data from raw CSVs
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_districts.py
          python3 scripts/build_ballotpedia.py
          python3 scripts/build_members.py
          python3 scripts/build_payroll.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/chambers.json data/election_sources.json _site/data/
          for c in assembly senate; do mkdir -p _site/data/$c && cp -r data/$c/periods data/$c/districts.json data/$c/ballotpedia.json data/$c/members.json _site/data/$c/; [ -d data/$c/travel ] && cp -r data/$c/travel _site/data/$c/; if [ -f data/$c/payroll.json ]; then cp data/$c/payroll.json _site/data/$c/; fi; cp data/$c/campaign_finance.json data/$c/makeup.json data/$c/donations.json data/$c/demographics.json data/$c/enrollment.json data/$c/public_financing.json data/$c/outside_money.json data/$c/history.json data/$c/legislation.json _site/data/$c/; [ -f data/$c/lobbying.json ] && cp data/$c/lobbying.json _site/data/$c/ || true; done
          cp data/vendor_donors.json data/limits_2026.json _site/data/ && mkdir -p _site/data/geo && cp data/geo/zip_districts.json _site/data/geo/
          mkdir -p _site/data/budget && cp data/budget/legislature.json data/budget/history.json _site/data/budget/
          cp docs/social-preview.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
